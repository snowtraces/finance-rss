<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>财经资讯聚合</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 20px auto !important;
            line-height: 1.6;
            padding: 16px;
        }

        h1 {
            text-align: center;
            margin: 0.3em 0 0;
        }

        p,
        h3 {
            margin: 0.3em 0;
        }

        article {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        a {
            color: #0066cc;
            text-decoration: none;
        }

        .news-number {
            font-weight: bold;
            margin-right: 10px;
        }

        .publish-date {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        #last-update {
            text-align: center;
            font-size: 0.8em;
            color: #666;
            margin-top: -0.5em;
            margin-bottom: 1em;
        }
    </style>
</head>

<body>
    <section class="section">
        <div class="container">
            <h1 id="title">财经资讯聚合</h1>
            <div id="last-update"></div>
            <div id="news"></div>
            <script>
                fetch('finance_feed.xml', {
                    cache: 'no-store', // 禁用缓存
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                })
                    .then(r => r.text())
                    .then(t => {
                        const parser = new DOMParser();
                        const xml = parser.parseFromString(t, "application/xml");
                        const lastBuildDate = xml.querySelector("lastBuildDate")
                        if (lastBuildDate) {
                            document.getElementById("last-update").textContent = `最后更新: ${new Date(lastBuildDate.textContent).toLocaleString('zh-CN')}`;
                        }
                        const items = xml.querySelectorAll("item");
                        const container = document.getElementById("news");
                        items.forEach((i, index) => {
                            const title = i.querySelector("title")?.textContent;
                            const link = i.querySelector("link")?.textContent;
                            const desc = i.querySelector("description")?.textContent;
                            const pubDate = i.querySelector("pubDate")?.textContent;

                            // 格式化日期
                            let dateStr = '';
                            if (pubDate) {
                                const date = new Date(pubDate);
                                dateStr = `<div class="publish-date">${date.toLocaleString('zh-CN')}</div>`;
                            }

                            const art = document.createElement("article");
                            art.innerHTML = `<a href="${link}" target="_blank"><h3><span class="news-number">${index + 1}.</span>${title}</h3></a><p>${desc}</p>${dateStr}`;
                            container.appendChild(art);
                        });
                    });
            </script>
        </div>
    </section>
</body>

</html>
